[project]
name = "realtime-arabic-voice-ai-agent"
version = "0.1.0"
description = "A local, half-duplex Arabic telecom voice assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20",
  "asyncpg>=0.29", "pydantic-settings>=2.5", "httpx>=0.27", "langgraph>=0.2",
  "redis>=5.0", "python-multipart>=0.0.9"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
speech = ["faster-whisper>=1.0", "torch>=2.3", "silero-vad>=5.1", "piper-tts>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "websockets>=12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702"]
